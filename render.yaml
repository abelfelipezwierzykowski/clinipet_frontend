services:
  - type: web
    name: clinipet-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false # URL pública da API, ex.: https://clinipet-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
